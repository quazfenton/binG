name: Deploy Frontend (Vercel)

on:
  push:
    branches: [ master ]
    paths:
      - 'web/**'
      - 'packages/**'     # Frontend-affecting changes in shared packages also need deployment
      - 'pnpm-lock.yaml'  # Dependency changes can break the build
      - 'package.json'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Compute Vercel deploy args
        id: vercel-args
        run: |
          if [ -n "${{ vars.VERCEL_PROJECT_ID }}" ]; then
            echo "deploy_args=--project=${{ vars.VERCEL_PROJECT_ID }}" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --token=$VERCEL_TOKEN ${{ steps.vercel-args.outputs.deploy_args }}
        working-directory: ./web
      # Note: Consider adding a project link (vercel.json `orgId`/`projectId`)
      # or setting VERCEL_PROJECT_ID / VERCEL_ORG_ID as repository variables.
      # Without these, fresh runners may stall because the CLI has no project context.
