name: Deploy Frontend (Vercel)

on:
  push:
    branches: [ master ]
    paths:
      - 'web/**'
      - 'packages/**'     # Frontend-affecting changes in shared packages also need deployment
      - 'pnpm-lock.yaml'  # Dependency changes can break the build
      - 'package.json'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} ${{ vars.VERCEL_PROJECT_ID && format('--scope={0}', vars.VERCEL_PROJECT_ID) || '' }}
        working-directory: ./web
      # Note: Consider adding a project link (vercel.json `orgId`/`projectId`)
      # or setting VERCEL_PROJECT_ID / VERCEL_ORG_ID as repository variables.
      # Without these, fresh runners may stall because the CLI has no project context.
