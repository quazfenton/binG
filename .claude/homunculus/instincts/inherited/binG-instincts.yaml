# BinG Workflow Multi Package Dependency Upgrade

## Action

Follow the multi-package-dependency-upgrade workflow:
1. Identify outdated dependencies in each package.
2. Update the version in package.json for each affected package.
3. Regenerate package-lock.json or pnpm-lock.yaml for each updated package.
4. Commit all updated package.json and lock files together.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: */package.json, */package-lock.json, */pnpm-lock.yaml

