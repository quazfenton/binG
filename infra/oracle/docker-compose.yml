# docker-compose for Oracle ARM A1 (Always Free) host.
# One VM, three containers, one Caddy fronting them with auto-TLS.
#
# Hostnames assumed (set DNS A records on the Oracle VM public IP):
#   api.${DOMAIN}      → backend Hono orchestrator
#   router.${DOMAIN}   → 9Router LLM gateway
#
# Bring up:
#   cd /opt/bing && docker compose -f infra/oracle/docker-compose.yml up -d --build

name: bing

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # No DOMAIN/ACME_EMAIL until we have a real domain for TLS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - ninerouter
    networks: [edge]

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    image: bing-backend:latest
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      PORT: "3001"
      NODE_ENV: production
      # Backend talks to 9router on the internal docker network
      NINEROUTER_BASE_URL: http://ninerouter:3000
      # Exclude client-only route files that crash the backend
      BACKEND_ROUTE_EXCLUDES: "/desktop/"
    depends_on:
      - ninerouter
    networks: [edge]

  ninerouter:
    build:
      context: .
      dockerfile: 9router.Dockerfile
    image: bing-9router:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      # 9router auth: INITIAL_PASSWORD seeds the dashboard password on first init
      # (only honored when the data volume is empty). JWT_SECRET signs session tokens.
      # NINEROUTER_ADMIN_KEY is kept for downstream consumers (backend/Vercel) that
      # call 9router programmatically with an X-Admin-Key header.
      INITIAL_PASSWORD: ${NINEROUTER_ADMIN_KEY}
      JWT_SECRET: ${JWT_SECRET}
      NINEROUTER_ADMIN_KEY: ${NINEROUTER_ADMIN_KEY}
    volumes:
      # 9router persists its SQLite DB and config under $HOME/.9router (i.e. /root/.9router
      # in this image since it runs as root). Mount the named volume there so the dashboard
      # password and saved configuration survive container recreation.
      - ninerouter_data:/root/.9router
    networks: [edge]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Creates a tunnel from Cloudflare edge → http://caddy:80
    # Provides a *.trycloudflare.com URL with automatic HTTPS
    command: tunnel --url http://caddy:80
    depends_on:
      - caddy
    networks: [edge]

volumes:
  caddy_data:
  caddy_config:
  ninerouter_data:

networks:
  edge:
    driver: bridge
