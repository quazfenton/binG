# netlify.toml — OPTIONAL edge wrapper in front of the Oracle backend.
#
# Use this only for: short webhooks, geo-routing, edge auth.
# Do NOT route /api/chat through Netlify — it will time out at 26s and
# kill SSE streaming. Send /api/chat directly to https://api.${DOMAIN}.
#
# Deploy:    netlify deploy --prod --dir=netlify/edge

[build]
  publish = "netlify/edge"
  edge_functions = "netlify/edge-functions"

# Forward generic /netlify/* admin endpoints; everything else goes to Vercel/Oracle.
[[edge_functions]]
  function = "geo-route"
  path     = "/edge/*"

# Block deployment from accidentally including the heavy backend or web/.
[functions]
  included_files     = ["netlify/edge-functions/**"]
  excluded_files     = ["backend/**", "web/**", "packages/**", "infra/**"]

[context.production.environment]
  ORACLE_BACKEND_URL = "https://api.example.com"
  NINEROUTER_URL     = "https://router.example.com"
