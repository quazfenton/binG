# fly.toml — binG dedicated backend (Hono orchestrator)
# Deploy from repo root:  fly deploy --config backend/fly.toml --dockerfile backend/Dockerfile
#
# This is the "Brain": SSE streams, /api/chat, agent orchestration.
# Heavy long-running jobs are offloaded to BullMQ workers (separate app).

app = "bing-backend"
primary_region = "iad"           # Pick the region nearest your DB / Vercel users
kill_signal    = "SIGINT"
kill_timeout   = "30s"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT     = "3001"
  # FRONTEND_URL must be set as a SECRET (or here) — used by Hono CORS allowlist.
  # FRONTEND_URL = "https://your-app.vercel.app"

[http_service]
  internal_port       = 3001
  force_https         = true
  auto_stop_machines  = "stop"   # Suspend when idle to save credit
  auto_start_machines = true
  min_machines_running = 0       # Bump to 1 if you need always-warm SSE
  processes = ["app"]

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 200
    hard_limit = 500

[[http_service.checks]]
  grace_period  = "10s"
  interval      = "30s"
  method        = "GET"
  timeout       = "5s"
  path          = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpus   = 1
