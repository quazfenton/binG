name = "shared-ingress"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
account_id = "69131dbe7a982d6e0ded89318103b605"

# === Configuration Model =========================================
# Plain vars (in this file, also overridable at runtime via KV):
#   BACKEND_URL    — OCI backend URL (e.g. https://api.bing.dev or current
#                    Cloudflare tunnel URL). Runtime override is written to
#                    KV key `runtime:BACKEND_URL` by POST /admin/backend-url.
#   FRONTEND_URL   — Vercel frontend URL.
#
# Secrets (set via `npx wrangler secret put <NAME>`):
#   JWT_SECRET     — HS256 secret for verifying JWT tokens at the edge.
#   ALLOWED_ORIGINS — Comma-separated list of allowed CORS origins.
#   ADMIN_TOKEN    — Required to call POST /admin/backend-url. If unset,
#                    the admin endpoint returns 503 (disabled).
# =================================================================

[vars]
# Deploy-time defaults. Overridable at runtime via KV (see above).
# Update with: `npx wrangler deploy --var BACKEND_URL="https://..."` or by
# editing this file and redeploying.
# BACKEND_URL is typically overridden at runtime via KV (key `runtime:BACKEND_URL`),
# set by the tunnel-sync systemd timer. If KV is unavailable, an empty string
# causes the router to fall back to FRONTEND_URL instead of a dead tunnel URL.
BACKEND_URL = ""
FRONTEND_URL = "https://web-eight-ashen-83.vercel.app"
# Cloudflare account ID (also at the top of this file as `account_id`).
# Used by the IP flood monitor's scheduled handler to query the Analytics
# Engine dataset via the HTTP SQL API. The scheduled handler reads both
# this and CLOUDFLARE_API_TOKEN (a secret) and no-ops if either is missing.
CF_ACCOUNT_ID = "69131dbe7a982d6e0ded89318103b605"
# IP flood threshold: req/min over which an IP is added to the deny list.
# Default 500 (the in-worker IP rate limiter is 100/min, so anything well
# above 500 is clearly abusive). Override at deploy time with
# `--var IP_FLOOD_THRESHOLD="1000"`.
IP_FLOOD_THRESHOLD = "500"

# === KV Namespace (Session Cache + Rate Limiting + Runtime Config) ===
[[kv_namespaces]]
binding = "BING_KV"
id = "57675a898c684724a66a1d85562c4327"
preview_id = ""

# === R2 Bucket (File Storage — replaces MinIO) ===
[[r2_buckets]]
binding = "BING_STORAGE"
bucket_name = "bing-storage"
preview_bucket_name = "bing-storage-dev"

# === R2 Bucket (Structured Trace Logs) ===
# Writes [TRACE] filtered log lines to R2 for durable persistence.
# Layout: traces/YYYY-MM-DD/HH/MM-{random}.ndjson (NDJSON, one entry per line)
# This is a SEPARATE bucket from BING_STORAGE so trace logs don't mix with user files.
[[r2_buckets]]
binding = "TRACE_R2"
bucket_name = "trace-logs"
preview_bucket_name = "trace-logs-dev"

# === Analytics Engine Dataset (IP Flood Monitor) ===
# Free tier: 100,000 events/day written, 30-day retention, SQL queryable.
# Replaces what would otherwise be a Cloudflare WAF rate-limit rule
# (not available on the Free plan). One row written per request via
# `analytics.writeDataPoint()`; a scheduled handler (see [triggers] below)
# queries the dataset every minute and rebuilds a deny list in KV.
[[analytics_engine_datasets]]
binding = "IP_FLOOD_MONITOR"
dataset = "ip_flood_monitor"

# === Cron Triggers ===
# `*/1 * * * *` — every minute. Runs the scheduled() handler in src/index.ts
# which queries the Analytics Engine dataset for IPs that exceeded the
# flood threshold in the last 60s and writes the resulting deny list to KV.
[triggers]
crons = ["*/1 * * * *"]

# === D1 Database (Lightweight SQL — replaces parts of PostgreSQL) ===
# Created via setup.sh — uncomment when D1 database is needed
# [[d1_databases]]
# binding = "BING_DB"
# database_name = "bing-db"
# database_id = ""

# === Routes ===
# ⚠️ COMMENT OUT for initial deploy — only enable after configuring a custom domain.
# Run: npx wrangler deploy  # (first deploy, no custom domain)
# Then set up custom domain in Cloudflare Dashboard, get zone_id, and uncomment:
# routes = [
#   { pattern = "api.bing.dev/*", zone_id = "" },  # ⚠️ Set your zone_id after adding domain
# ]

# === Observability ===
# Platform-level (wrangler.toml) is DISABLED — path-filtered logging is
# implemented in src/index.ts so only high-value API paths are traced.
# The Bing project has high-volume polling (file checks, SSE, static assets)
# that would exhaust the free tier's 100k req/day quota at 100% sampling.
#
# Traced paths (code-level, console.log only):
#   /v1/chat/completions  — AI API calls
#   /api/chat             — Hono server chat
#   /copa/*               — CopaMundial API
#   /nocturne/*           — Nocturne API
#   /novnc/*              — noVNC sessions
#
# All other paths are silent (no platform log/trace emitted).
[observability]
enabled = true
head_sampling_rate = 0  # Disable platform sampling — code handles filtering
