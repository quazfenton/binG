packages:
  - "desktop"
  - "packages/*"
  - "web"
  - "backend"

# pnpm 9+ native-binding allowlist. Replaces the deprecated pnpm 8 `allowBuilds` map
# (which used placeholder string values, causing the install scripts of these
# native-binding packages — including `better-sqlite3` — to be silently skipped in
# CI/production builds). With this array, pnpm 9+ approves the install script of
# each listed package so `prebuild-install` / `node-gyp rebuild` actually runs
# and the `.node` binding lands in `node_modules/<pkg>/build/Release/`.
#
# If a new native-binding package is added to the workspace, append it here too.
onlyBuiltDependencies:
  - "@google/genai"
  - "@matrix-org/matrix-sdk-crypto-nodejs"
  - "@smithery/cli"
  - agent-browser
  - better-sqlite3
  - bufferutil
  - cbor-extract
  - cpu-features
  - es5-ext
  - esbuild
  - msgpackr-extract
  - node-pty
  - protobufjs
  - sharp
  - ssh2
  - utf-8-validate"
