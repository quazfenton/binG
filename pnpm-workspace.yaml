packages:
  - "desktop"
  - "packages/*"
  - "web"
  - "backend"

# pnpm 9+ native-binding allowlist. Replaces the deprecated pnpm 8 `allowBuilds` map
# (which used placeholder string values, causing the install scripts of these
# native-binding packages — including `better-sqlite3` — to be silently skipped in
# CI/production builds). With this array, pnpm 9+ approves the install script of
# each listed package so `prebuild-install` / `node-gyp rebuild` actually runs
# and the `.node` binding lands in `node_modules/<pkg>/build/Release/`.
#
# If a new native-binding package is added to the workspace, append it here too.
onlyBuiltDependencies:
  - "@google/genai"
  - "@matrix-org/matrix-sdk-crypto-nodejs"
  - "@smithery/cli"
  - agent-browser
  - better-sqlite3
  - bufferutil
  - cbor-extract
  - cpu-features
  - es5-ext
  - esbuild
  - msgpackr-extract
  - node-pty
  - protobufjs
  - sharp
  - ssh2
  - utf-8-validate

# Package overrides. In pnpm v9, these MUST live in pnpm-workspace.yaml — putting
# them under `package.json#pnpm.overrides` is silently ignored and emits a
# deprecation warning on every `pnpm install`. Moved here so the security
# overrides (tar/qs/elliptic/vm2/etc.) actually take effect.
overrides:
  next: "^16.2.5"
  node-forge: ">=1.3.2"
  qs: ">=6.14.1"
  "@modelcontextprotocol/sdk": ">=1.25.2"
  form-data: ">=4.0.4"
  minimatch: ">=10.2.1"
  fast-xml-parser: ">=5.3.6"
  tar: ">=7.4.0"
  jsondiffpatch: ">=0.6.0"
  undici: ">=7.1.0"
  glob: ">=11.0.0"
  ioredis: "^5.4.1"
  "bullmq>ioredis": "^5.4.1"
  elliptic: "^6.6.1"
  vm2: ">=3.11.4"
