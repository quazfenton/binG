# fly.toml — 9Router LLM Gateway (separate app)
# This is NOT the Hono backend. It's the multi-tenant OAuth proxy / BYOK gateway
# described in web/lib/providers/9router/README.md.
#
# Deploy steps:
#   1. Fork the upstream 9router repo (apply the modifications under FORKS/).
#   2. Place this fly.toml at the root of that fork.
#   3.  fly launch --no-deploy   then   fly deploy
#
# The Hono backend reaches it via env NINEROUTER_BASE_URL.

app = "bing-9router"
primary_region = "iad"

[build]
  # Use the Dockerfile shipped with the 9router fork.

[env]
  NODE_ENV = "production"
  PORT     = "3000"

[http_service]
  internal_port       = 3000
  force_https         = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout  = "5s"
  method   = "GET"
  path     = "/health"

[[mounts]]
  # Persistent volume for the 9router SQLite token store.
  source      = "ninerouter_data"
  destination = "/data"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
